[package]
name = "agent-fuse"
version = "0.6.2"
edition = "2021"
description = "Millisecond-scale APFS CoW workspace time machine & runaway circuit breaker for AI coding agents"
license = "MIT"

[lib]
name = "agent_fuse"
path = "src/lib.rs"

[[bin]]
name = "afuse"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
