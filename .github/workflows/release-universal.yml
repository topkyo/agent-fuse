name: Release Universal macOS Artifacts

# Trigger strictly on version tags or manual dispatch (never on branch push/PR)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-universal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-universal:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust targets (x86_64 + aarch64)
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build & lipo Universal CLI binary
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/afuse \
            target/aarch64-apple-darwin/release/afuse \
            -output dist/afuse
          strip -x dist/afuse
          lipo -archs dist/afuse
          chmod +x dist/afuse

      - name: Code Signing & Optional Apple Notarization
        env:
          REQUIRE_APPLE_NOTARIZATION: ${{ vars.REQUIRE_APPLE_NOTARIZATION }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          ANY_APPLE_SECRET="${APPLE_CERT_BASE64}${APPLE_CERT_PASSWORD}${APPLE_ID}${APPLE_TEAM_ID}${APPLE_APP_SPECIFIC_PASSWORD}"
          if [ "${REQUIRE_APPLE_NOTARIZATION:-}" = "true" ] && [ -z "$ANY_APPLE_SECRET" ]; then
            echo "REQUIRE_APPLE_NOTARIZATION is enabled but Apple signing secrets are missing." >&2
            exit 2
          fi
          if [ -n "$ANY_APPLE_SECRET" ]; then
            if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_CERT_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
              echo "Incomplete Apple signing/notarization secrets: provide all 5 secrets or none for unsigned ad-hoc track." >&2
              exit 2
            fi
            echo "Complete Developer ID credentials detected -> signing & notarizing..."
            KEYCHAIN_PATH="$RUNNER_TEMP/cli-build.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/cert.p12"
            NOTARY_PROFILE="afuse-notary-profile"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            (
              umask 077
              printf '%s' "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"
            )
            security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
            EXISTING_KEYCHAINS=()
            while IFS= read -r kc; do
              kc="$(printf '%s' "$kc" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              kc="${kc#\"}"
              kc="${kc%\"}"
              [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')
            [ -n "$IDENTITY" ] || { echo "Missing Developer ID Application identity" >&2; exit 2; }
            codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/afuse
            ditto -c -k --keepParent dist/afuse dist/afuse-macos-universal.zip
            printf '%s\n' "$APPLE_APP_SPECIFIC_PASSWORD" | xcrun notarytool store-credentials "$NOTARY_PROFILE" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --keychain "$KEYCHAIN_PATH" >/dev/null
            xcrun notarytool submit dist/afuse-macos-universal.zip \
              --keychain-profile "$NOTARY_PROFILE" \
              --keychain "$KEYCHAIN_PATH" \
              --wait
            tar -czf dist/afuse-macos-universal.tar.gz -C dist afuse
            rm -f dist/afuse-macos-universal.zip
          else
            echo "Ad-hoc track -> applying deterministic ad-hoc signature..."
            codesign --force --sign - dist/afuse
            tar -czf dist/afuse-macos-universal.tar.gz -C dist afuse
          fi
          rm -f dist/afuse dist/afuse-macos-universal.zip
          (
            cd dist
            shasum -a 256 afuse-macos-universal.tar.gz > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Scrub temporary signing keychain & certificate
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/cli-build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/cli-build.keychain-db" 2>/dev/null || rm -f "$RUNNER_TEMP/cli-build.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afuse-universal-dist
          path: |
            dist/afuse-macos-universal.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    needs: build-universal
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: afuse-universal-dist
          path: dist

      - name: Verify checksums before publish
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/afuse-macos-universal.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
