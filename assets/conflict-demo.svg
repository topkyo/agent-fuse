  <rect x="628" y="76" width="516" height="34" rx="8" fill="#181C29" stroke="#2C3246"/>
  <text x="642" y="98" fill="#F3F5F9" font-family="-apple-system,sans-serif" font-size="13" font-weight="700">● AgentFuse Control Window</text>
  <rect x="1032" y="81" width="102" height="24" rx="6" fill="#2B1C12" stroke="#E6BD4C" stroke-opacity="0.6"/>
  <g class="trip">
    <path d="M1050 85.5 l6.5 2.4 v4.4 c0 3.7 -2.7 6.8 -6.5 8 c-3.8 -1.2 -6.5 -4.3 -6.5 -8 v-4.4 z" fill="#1F180D" stroke="#E6BD4C" stroke-width="1.3"/>
    <path d="M1050.8 88.2 l-3.2 4.9 h2.7 l-0.9 4.3 l3.5 -5.1 h-2.7 z" fill="#F8C15C"/>
    <text x="1064" y="97" fill="#F8C15C" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">! 142</text>
  </g>

  <g class="p2">
    <rect x="628" y="122" width="516" height="44" rx="8" fill="#32181B" stroke="#F87171" stroke-opacity="0.7"/>
    <circle cx="647" cy="144" r="7" fill="#F87171" fill-opacity="0.24" stroke="#F87171" stroke-width="1.3"/>
    <text x="647" y="148" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700">!</text>
    <text x="662" y="149" fill="#FFE4E6" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="600">142 files deleted — Press Return</text>
    <rect x="962" y="130" width="168" height="28" rx="6" fill="#28AD70"/>
    <text x="1046" y="148" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="700">Instant Rescue (142)</text>
  </g>

  <g class="p3">
    <rect x="628" y="180" width="516" height="202" rx="10" fill="url(#goldCard)" stroke="#E6BD4C" stroke-width="1.8"/>
    <rect x="636" y="188" width="500" height="186" rx="6" fill="none" stroke="#E6BD4C" stroke-opacity="0.32"/>
    <text x="654" y="216" fill="#E6BD4C" font-family="-apple-system,sans-serif" font-size="12" font-weight="700">AGENTFUSE · APFS RECOVERY RECEIPT</text>
    <text x="654" y="256" fill="#FFFFFF" font-family="-apple-system,sans-serif" font-size="24" font-weight="800">142 UNCOMMITTED FILES RESTORED</text>
    <text x="654" y="288" fill="#F3CF68" font-family="ui-monospace,Menlo,monospace" font-size="13">Restored in 12.60 ms · 0 B CoW at t=0 · Merkle Verified</text>
    <line x1="654" y1="306" x2="1118" y2="306" stroke="#E6BD4C" stroke-opacity="0.25"/>
    <text x="654" y="332" fill="#B5BAC7" font-family="ui-monospace,Menlo,monospace" font-size="11">Receipt #a94f2c10 · Root cwd Inode Preserved · Auto-Copied · ⌘V to Paste</text>
    <text x="654" y="358" fill="#E6BD4C" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="700">&lt; 5 MiB Universal DMG (~2.7 MiB single-arch) · Free 1-Repo Forever · $19 / ¥98 Pro</text>
  </g>

  <text x="628" y="408" fill="#9CA3AF" font-family="-apple-system,sans-serif" font-size="11.5">✦ AgentFuse Pro · 100% Offline Ed25519  |  0 Telemetry · macOS 12+ APFS</text>
</svg>
