<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="AgentFuse 5-second rm -rf conflict and 12.60ms APFS recovery animation">
  <style>
    @keyframes phase1 { 0%, 4% { opacity: 0.2; } 8%, 94% { opacity: 1; } 100% { opacity: 0.2; } }
    @keyframes phase2 { 0%, 26% { opacity: 0; transform: translateY(4px); } 30%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes phase3 { 0%, 54% { opacity: 0; transform: scale(0.97); } 60%, 94% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes pulseTrip { 0%, 26% { opacity: 0; } 28%, 54% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes progBar { 0% { width: 0px; } 100% { width: 1120px; } }
    .p1 { animation: phase1 5s infinite; }
    .p2 { animation: phase2 5s infinite; }
    .p3 { animation: phase3 5s infinite; }
    .trip { animation: pulseTrip 5s infinite; }
    .bar { animation: progBar 5s linear infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#0F121B"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D12"/>
      <stop offset="100%" stop-color="#1E180B"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="458" rx="16" fill="url(#bg)" stroke="#232838" stroke-width="2"/>

  <!-- Top 5s timeline bar -->
  <rect x="40" y="20" width="1120" height="4" rx="2" fill="#1C2030"/>
  <rect x="40" y="20" width="0" height="4" rx="2" fill="#E6BD4C" class="bar"/>
  <text x="40" y="44" fill="#8B94AA" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">5.0s Uncut Conflict Demo  |  0.0s rm -rf src/*  ->  1.5s Tripwire Alert  ->  3.0s Instant Rescue (12.60 ms)</text>

