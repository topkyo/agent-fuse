  <path d="M40 74 a12 12 0 0 1 12 -12 h524 a12 12 0 0 1 12 12 v22 h-548 z" fill="#141824"/>
  <circle cx="60" cy="79" r="5" fill="#FF5F56"/>
  <circle cx="78" cy="79" r="5" fill="#FFBD2E"/>
  <circle cx="96" cy="79" r="5" fill="#27C93F"/>
  <text x="314" y="83" text-anchor="middle" fill="#7D869C" font-family="ui-monospace,Menlo,monospace" font-size="11">zsh — ~/my-app (142 uncommitted files, APFS)</text>

  <g class="p1">
    <text x="58" y="128" fill="#34D399" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">$</text>
    <text x="74" y="128" fill="#F3F5F9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">rm -rf src/*</text>
    <text x="58" y="152" fill="#F87171" font-family="ui-monospace,Menlo,monospace" font-size="12">× 142 uncommitted files deleted! git checkout cannot help.</text>
    <text x="58" y="172" fill="#9CA3AF" font-family="ui-monospace,Menlo,monospace" font-size="11.5">$ ls src/ | wc -l  ->  0</text>
  </g>

  <g class="p2">
    <rect x="56" y="192" width="516" height="58" rx="8" fill="#221414" stroke="#F87171" stroke-opacity="0.65"/>
    <text x="70" y="215" fill="#FCA5A5" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700">⚡️ FUSE TRIPPED · SIGSTOP -> SIGKILL -pgid</text>
    <text x="70" y="236" fill="#E5C07B" font-family="ui-monospace,Menlo,monospace" font-size="11.5">FSEvents frozen · 0 B CoW baseline intact in ~/.agent-fuse</text>
  </g>

  <g class="p3">
    <text x="58" y="284" fill="#34D399" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">$</text>
    <text x="74" y="284" fill="#F3F5F9" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">afuse restore latest &amp;&amp; stat -f %i .</text>
    <rect x="56" y="298" width="516" height="106" rx="8" fill="#0D261B" stroke="#34D399" stroke-opacity="0.7"/>
    <text x="70" y="322" fill="#6EE7B7" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700">✓ Restored 142 files in 12.60 ms (renamex_np swap)</text>
    <text x="70" y="346" fill="#A7F3D0" font-family="ui-monospace,Menlo,monospace" font-size="11.5">├─ Root cwd Inode PRESERVED: 12948571 -> 12948571 (shell intact)</text>
    <text x="70" y="368" fill="#A7F3D0" font-family="ui-monospace,Menlo,monospace" font-size="11.5">├─ Safety backup : auto:pre-restore created (0 B CoW)</text>
    <text x="70" y="390" fill="#A7F3D0" font-family="ui-monospace,Menlo,monospace" font-size="11.5">└─ Merkle SHA-256: a94f2c10... VERIFIED | $ ls src/ -> 142</text>
  </g>

  <!-- Right Pane: AgentFuse Pro Control Window + Card -->
